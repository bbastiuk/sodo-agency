             C66 430 78 358 104 310
             C122 276 148 254 172 240
             C160 222 152 198 152 172
             C152 120 180 86 222 86
             C264 86 292 120 292 172
             C292 200 282 226 268 244
             C298 260 322 286 338 324
             C358 372 368 440 372 520
             Z"/>
  </g>

  <!-- середня -->
  <g transform="translate(336 108) scale(.74)">
    <path d="M58 520
             C62 424 76 350 104 302
