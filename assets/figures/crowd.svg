<!--
  Три постаті різного плану — глибина без перспективи.

  Та сама мова, що й у figure.svg: суцільні контури зі змінною
  товщиною, без еліпсів-голів і паличок-кінцівок. У кадрі це йде
  під розмиттям ~17px, тому анатомія не потрібна — але потрібна
  органіка силуету, інакше форми читаються як піктограми.

  Кожна постать має власний нахил і ширину плечей: однакові фігури
  в ряд одразу видають копіювання.
-->
